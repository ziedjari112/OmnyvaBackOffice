<div class="page-container">
  <div class="toolbar">
    <h1>{{ 'payrollConfig.title' | translate }}</h1>
  </div>

  @if (loading()) {
    <p class="muted">{{ 'common.loading' | translate }}</p>
  } @else {
    <div class="form-grid">
      <label>
        {{ 'payrollConfig.staffPercentage' | translate }}
        <input
          type="number"
          min="0"
          max="100"
          step="0.01"
          [ngModel]="staffPercentage()"
          (ngModelChange)="onPercentageChange(+$event)"
        />
      </label>
      <label>
        {{ 'payrollConfig.entreprisePercentage' | translate }}
        <input type="number" [ngModel]="entreprisePercentage()" disabled />
      </label>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn primary" [disabled]="saving()" (click)="save()">
        {{ 'common.save' | translate }}
      </button>
      @if (saved()) {
        <span class="muted">{{ 'common.saved' | translate }}</span>
      }
    </div>
  }
</div>
